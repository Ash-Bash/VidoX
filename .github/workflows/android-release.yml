name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VidoX_Google

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        id: keystore
        env:
          VIDOX_KEYSTORE_BASE64: ${{ secrets.VIDOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$VIDOX_KEYSTORE_BASE64" ]; then
            echo "$VIDOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vidox-release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "VIDOX_STORE_FILE=$RUNNER_TEMP/vidox-release.jks" >> "$GITHUB_ENV"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No VIDOX_KEYSTORE_BASE64 secret — APK will use debug signing."
          fi

      - name: Assemble release
        env:
          VIDOX_STORE_PASSWORD: ${{ secrets.VIDOX_STORE_PASSWORD }}
          VIDOX_KEY_ALIAS: ${{ secrets.VIDOX_KEY_ALIAS }}
          VIDOX_KEY_PASSWORD: ${{ secrets.VIDOX_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find "$HOME/Library/Caches/VidoX_Google/app/outputs/apk/release" \
                      "$HOME/.gradle" \
                      "app/build/outputs/apk/release" \
                      "../Library/Caches/VidoX_Google/app/outputs/apk/release" \
                      -name "*.apk" 2>/dev/null | head -n 1)
          # AGP with relocated buildDirectory writes under $HOME/Library/Caches/...
          if [ -z "$APK" ]; then
            APK=$(find "$HOME/Library/Caches/VidoX_Google" -path "*/outputs/apk/release/*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            find "$HOME/Library/Caches/VidoX_Google" -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Name release asset
        id: asset
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            NAME="VidoX-${TAG}-android.apk"
          else
            NAME="VidoX-${TAG}-android-debug-signed.apk"
          fi
          cp "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.path }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
